name: fast-build
# Targeted build of named ninja targets at an explicit source revision, plus host-side export checks.
# Manual dispatch only. The source is a ref of THIS private repository (refs/heads/src/<branch>).

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref in this repo (refs/heads/src/<branch>)"
        required: true
        type: string
      source_sha:
        description: "Exact 40-hex commit to build (must be the head of source_ref unless allow_older_revision)"
        required: true
        type: string
      targets:
        description: "Space-separated ninja targets (e.g. kernel32 kernelbase ntdll)"
        required: true
        type: string
      config:
        description: "Build configuration"
        required: true
        default: clang-amd64
        type: choice
        options: [clang-amd64, gcc-amd64, clang-i386, clang-arm64]
      extra_cmake:
        description: "Extra -D flags for configure (optional)"
        required: false
        default: ""
        type: string
      allow_older_revision:
        description: "Build a commit that is no longer the head of source_ref"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fast-${{ inputs.source_ref }}-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_REF: ${{ inputs.source_ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Record start
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout CI scripts (main)
        uses: actions/checkout@v6
        with:
          ref: main
          path: ci
          persist-credentials: false

      - name: Checkout submitted source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: src
          fetch-depth: 1
          persist-credentials: true

      - name: Verify source revision
        run: sh ci/ci/verify-source.sh src "$SOURCE_SHA" "$SOURCE_REF" "${{ inputs.allow_older_revision }}"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison ccache wget xz-utils tar python3-mako python3-yaml python3-packaging glslang-tools msitools

      - name: Toolchain pin
        id: pin
        run: |
          . ci/ci/toolchain.env
          echo "key=rosbe-${{ runner.os }}-$ROSBE_BOOTSTRAP_SHA256" >> "$GITHUB_OUTPUT"

      - name: Cache RosBE
        id: cache_rosbe
        uses: actions/cache@v5
        with:
          path: ~/.local/opt/rosbe
          key: ${{ steps.pin.outputs.key }}

      - name: Install pinned RosBE
        if: ${{ steps.cache_rosbe.outputs.cache-hit != 'true' }}
        run: sh ci/ci/install-rosbe.sh

      - name: Restore ccache
        id: ccache_restore
        uses: actions/cache/restore@v5
        with:
          path: ccache
          key: ccache-${{ inputs.config }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ inputs.config }}-

      - name: ccache settings
        run: |
          echo "CCACHE_BASEDIR=${{ github.workspace }}/src" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ github.workspace }}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=time_macros" >> "$GITHUB_ENV"

      - name: Configure
        id: configure
        working-directory: src
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          . "$GITHUB_WORKSPACE/ci/ci/toolchain.env"
          compiler=${{ inputs.config }}; arch=${compiler#*-}; compiler=${compiler%%-*}
          FLAGS=""
          [ "$compiler" = clang ] && FLAGS="$FLAGS --clang"
          [ "$compiler" = gcc ] && FLAGS="$FLAGS --gcc"
          [ "$compiler" = clang ] && [ "$arch" = amd64 ] && FLAGS="$FLAGS -DENABLE_MESA_LLVMPIPE=ON"
          ./configure.sh $FLAGS -a "$arch" $CMAKE_COMMON_FLAGS ${{ inputs.extra_cmake }} 2>&1 | tee ../configure.log
          ENV_NAME=$([ "$compiler" = clang ] && echo Clang || echo GCC)
          echo "outdir=output-$ENV_NAME-$arch-debug" >> "$GITHUB_OUTPUT"

      - name: Build submodules
        working-directory: src
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          ninja -C ${{ steps.configure.outputs.outdir }} submodules 2>&1 | tee ../submodules.log

      - name: Build targets
        id: build
        working-directory: src
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          set +e
          ninja -C ${{ steps.configure.outputs.outdir }} -k0 ${{ inputs.targets }} 2>&1 | tee ../build.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        shell: bash

      - name: Collect built targets
        if: always()
        working-directory: src
        run: |
          mkdir -p ../out/bin
          for t in ${{ inputs.targets }}; do
            find ${{ steps.configure.outputs.outdir }} -type f \( -name "$t.dll" -o -name "$t.exe" -o -name "$t.sys" -o -name "$t.lib" -o -name "$t" \) -not -path "*/_wow64_i386/*" -exec cp -v {} ../out/bin/ \; 2>/dev/null || true
          done
          ls -l ../out/bin || true

      - name: Export dumps (host-side, llvm-readobj)
        if: always()
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          python3 ci/ci/export-check.py dump src/${{ steps.configure.outputs.outdir }} out/exports $(for t in ${{ inputs.targets }}; do echo "$t.dll"; done) || true

      - name: Forwarder-loop check (only when system DLLs were built)
        if: always()
        run: |
          . "$HOME/.local/opt/rosbe/rosbe-env.sh"
          case " ${{ inputs.targets }} " in
            *" kernel32 "*|*" kernelbase "*|*" ntdll "*) python3 -u src/sdk/tools/check-forwarder-loops.py src/${{ steps.configure.outputs.outdir }} ;;
            *) echo "skipped: no kernel32/kernelbase/ntdll among targets" ;;
          esac

      - name: Manifest and checksums
        if: always()
        run: |
          python3 ci/ci/manifest.py --out out --source-sha "$SOURCE_SHA" --source-ref "$SOURCE_REF" \
            --config "${{ inputs.config }}" --status "${{ steps.build.outcome }}" --started "$STARTED" \
            --log build.log --targets "${{ inputs.targets }}" --toolchain-env ci/ci/toolchain.env \
            $(for f in out/bin/*; do [ -f "$f" ] && echo "--artifact $f"; done)
          cp -f configure.log submodules.log build.log out/ 2>/dev/null || true

      - name: Save ccache
        if: ${{ always() && steps.ccache_restore.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ccache
          key: ${{ steps.ccache_restore.outputs.cache-primary-key }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-${{ inputs.config }}-${{ inputs.source_sha }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
